# Checks every push and pull request. Make these required for merging into main (branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and types
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mux
          POSTGRES_PASSWORD: mux
          POSTGRES_DB: mux_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mux"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mux:mux@localhost:5433/mux_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mux/server/pyproject.toml
      - run: make setup-server
      - run: make test-server
      - run: make typecheck-server

  web:
    name: Web types, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mux/web/package-lock.json
      - run: make setup-web
      # Type check, ESLint with zero warnings, production build
      - run: make check-web

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Fails on critical issues in what ships to users. Known highs needing Next.js 16 are tracked in
      # ROAD_TO_PRODUCTION_EXCELLENCE.md; raise this to `high` once that upgrade lands.
      - name: Audit web dependencies
        working-directory: mux/web
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit backend dependencies
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --strict --progress-spinner off -r <(cd mux/server && python -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
