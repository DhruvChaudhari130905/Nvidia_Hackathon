services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mux
      POSTGRES_PASSWORD: mux
      POSTGRES_DB: mux
    ports:
      - "5433:5432"  # 5433 so it does not clash with a local Postgres
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mux"]
      interval: 2s
      timeout: 3s
      retries: 15
