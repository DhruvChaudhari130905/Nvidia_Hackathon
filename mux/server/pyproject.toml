[project]
name = "mux-server"
version = "0.1.0"
description = "MUX backend: room actors, coordinator, coder loop, and API."
requires-python = ">=3.11"
# Pin versions during week 1 setup.
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "openai",
  "tavily-python",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "alembic",
  "pyjwt",
  "python-jose[cryptography]",
  "aiosqlite",
  "httpx",
  "cryptography",
  "contree-sdk",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pyright"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Only the 'mux' package ships; docker/, migrations/ and scripts/ stay out of the wheel.
[tool.setuptools.packages.find]
include = ["mux*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
